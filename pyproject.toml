[project]
name = "pepper-carrot-redteam"
version = "0.1.0"
description = "An agentic red-teamer for the Pepper & Carrot RAG app: an MCP client that decides its own probes to discover failures, then writes them back as candidate gold for the deterministic evaluator"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",       # MCP client over Streamable HTTP (same server as the eval)
    "anthropic>=0.39",    # the agent loop (tool use) + the fuzzy verdict judge
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",        # writing candidate gold in the evaluator's schema
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0",
]

[project.scripts]
pepper-carrot-redteam = "pepper_carrot_redteam.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepper_carrot_redteam"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastmcp.*", "mcp.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
